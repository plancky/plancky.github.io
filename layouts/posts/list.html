{{ define "page" }}
    <section class="flex flex-col gap-16">
        {{ range site.Taxonomies.categories.Alphabetical }}
            <div class="flex flex-col gap-8">
                <h2>
                    <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
                </h2>
                {{ partial "components/post_list" .Pages }}
            </div>
        {{ end }}
        {{ with where .RegularPages "Params.categories" "==" nil }}
            <div class="flex flex-col gap-8">
                <h2>Other</h2>
                {{ partial "components/post_list" . }}
            </div>
        {{ end }}
    </section>
{{ end }}
