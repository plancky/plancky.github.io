{{ define "page" }}
    <section>
        <ul class="flex flex-col gap-10">
            {{ range .RegularPages }}
                <li class="flex items-baseline gap-4 text-left">
                    {{ partial "components/link" (dict "context" . "link_permalink" .RelPermalink "link_name" .Title ) }}
                    {{ range .GetTerms "categories" }}
                        <a
                            href="{{ .RelPermalink }}"
                            class="text-sm text-accent hover:underline"
                            >{{ .Title }}</a
                        >
                    {{ end }}
                </li>
            {{ end }}
        </ul>
    </section>
{{ end }}
